<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- 3D Shadow Base -->
  <rect x="0.75" y="1.5" width="14.5" height="14" rx="3.5" fill="#172554" />
  <!-- Main 3D Button Body -->
  <rect x="0.75" y="0.75" width="14.5" height="13.5" rx="3.5" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="0.7" filter="url(#btnShadow)" />
  <!-- Bold White Plus -->
  <line x1="8" y1="3.5" x2="8" y2="11.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
  <line x1="4" y1="7.5" x2="12" y2="7.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
</svg>
